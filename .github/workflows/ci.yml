name: CI

# Continuous integration for the DEFAULT branch.
#
# Policy: tests MAY be skipped here — a skip is reported, not fatal — but the
# run must always report coverage so a skip is visible rather than invisible.
# The strict counterpart is .github/workflows/release.yml, which runs the same
# suite on a published release and fails if any test fails to execute.
#
# This project is Windows-only by construction, so CI cannot run on Linux:
#
#   * build.cmd compiles with the .NET Framework's csc.exe
#     (%SystemRoot%\Microsoft.NET\Framework64\v4.0.30319\csc.exe). That ships
#     with Windows and is the whole reason the project needs no .NET SDK and
#     no NuGet restore.
#   * The installer is a WinForms GUI (/target:winexe, System.Windows.Forms).
#   * tests/ShimTests.cs executes real MSYS2 bash. Its assertions are about
#     MSYS2 process behaviour (exit-code propagation, quoting, PATH) and have
#     no meaning off Windows.
#
# A GitHub-hosted windows-latest runner is also *unconfined*, which matters:
# msys-2.0.dll cannot start under the Windows ACL sandbox (it needs a per-user
# named section that a write-restricted token denies, giving Win32 error 5).
# That is why a local sandboxed run reports the 10 ShimTests as skipped. Here
# they can actually run, which is what makes the coverage number meaningful.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Superseded pushes to the same ref cancel their predecessors.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Shared by every step: where the coverage tooling is unpacked. Kept out of
  # the repo tree so it can never be mistaken for project source.
  COVERAGE_TOOLS: ${{ github.workspace }}\.coverage-tools

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        # The scripts are batch/PowerShell, and the repo is pure ASCII by
        # policy (build.cmd documents why); bash would only add a translation
        # layer. Explicit shell also keeps `working-directory` predictable.
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        # Printed up front so a later "no csc.exe" or "no MSYS2" failure can be
        # attributed to the image instead of to this commit.
        run: |
          Write-Host "OS:        $([System.Environment]::OSVersion.VersionString)"
          Write-Host "pwsh:      $($PSVersionTable.PSVersion)"
          Write-Host "node:      $(node --version)"

          $csc = "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            Write-Error "csc.exe is missing from the runner image: $csc"
            exit 1
          }
          Write-Host "csc:       $csc"

      - name: Install MSYS2
        # Required by tests/ShimTests.cs, which runs real MSYS2 bash through
        # the compiled shim. Without it those 10 tests skip — which this
        # workflow tolerates and reports, and release.yml rejects.
        #
        # `location` is set explicitly so the tree lands at a path this
        # repository can state outright: ${{ github.workspace }}\msys\msys64.
        # ${{ github.workspace }} IS the GITHUB_WORKSPACE variable, which is
        # what lets Msys2Discovery derive the same path in code instead of
        # hard-coding a runner path — and what keeps this working whether or
        # not the runner happens to be Windows. The action's default location
        # is $RUNNER_TOOL_CACHE\msys2, which discovery also searches, so this
        # is about making the layout explicit rather than merely possible.
        uses: msys2/setup-msys2@v2
        with:
          location: ${{ github.workspace }}\msys

      - name: Verify MSYS2 landed where discovery expects it
        # Runs BEFORE the suite, so a layout change in the action surfaces as a
        # clear failure here rather than as an unexplained test failure or, far
        # worse, a silently skipped suite.
        #
        # Only the two marker files are needed: Msys2Discovery.IsShellCmd
        # accepts an install on exactly these, and that is the same check the
        # installer and the tests perform.
        #
        # DSH_MSYS2_ROOT is deliberately NOT set for the suite. Setting it
        # would mask a regression in the layout logic, and the point of this
        # change is that discovery can rely on the workspace layout without
        # also being told about it. A developer who needs to point the
        # installer somewhere else uses a git-ignored .env instead.
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'msys\msys64'
          $shell = Join-Path $root 'msys2_shell.cmd'
          $bash = Join-Path $root 'usr\bin\bash.exe'

          foreach ($f in @($shell, $bash)) {
            if (-not (Test-Path $f)) {
              Write-Host "expected MSYS2 layout under $root; found:"
              Get-ChildItem $env:GITHUB_WORKSPACE -Directory |
                ForEach-Object { Write-Host "  $($_.Name)\" }
              if (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'msys')) {
                Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'msys') -Directory |
                  ForEach-Object { Write-Host "  msys\$($_.Name)\" }
              }
              Write-Error "MSYS2 is not where discovery looks: $f is missing"
              exit 1
            }
            Write-Host "ok   $f"
          }

          Write-Host "MSYS2 shell: $shell"

      - name: Build
        # build.cmd builds the installer and the tests, and exits non-zero on a
        # compile error. A build failure is fatal in every mode: there is no
        # sense in which a broken build "may be skipped".
        run: .\build.cmd all

      - name: Verify build outputs exist
        run: |
          $expected = @(
            'build\msys2-installer.exe',
            'build\msys2-installer-cli.exe',
            'build\msys2-tests.exe',
            'build\Msys2ShellShim.cs'
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) { Write-Error "missing build output: $f"; exit 1 }
            $len = (Get-Item $f).Length
            if ($len -eq 0) { Write-Error "empty build output: $f"; exit 1 }
            Write-Host ("ok   {0} ({1} bytes)" -f $f, $len)
          }

      # ── coverage ───────────────────────────────────────────────────────────
      # Real line/branch coverage, measured by OpenCover.
      #
      # OpenCover is used rather than coverlet/dotnet-coverage because those
      # need a .NET SDK, which this project deliberately does not require (and
      # which the local machine does not even have installed). OpenCover is a
      # self-contained .NET Framework tool: "a code coverage tool (branch and
      # sequence point) for all .NET Frameworks 2 and above", i.e. exactly the
      # csc.exe-built assemblies this project produces. It is fetched as a
      # plain nupkg, so no SDK and no NuGet client are involved.
      #
      # OpenCover reads line/branch data from PDB sequence points, and build.cmd
      # does not pass /debug, so it emits no PDB. Without one OpenCover would
      # report nothing useful, so the test assembly is recompiled with
      # /debug:full here. The command below mirrors build.cmd's :do_tests
      # target exactly (same sources, same /main, same references) — if that
      # target changes, this must change with it.

      - name: Build test assembly with debug symbols
        run: |
          $csc = "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory -Force -Path build | Out-Null

          & $csc /nologo /target:exe /platform:anycpu /optimize- /debug:full /warn:4 `
            /main:Dsh.Msys2Installer.Tests.TestMain `
            /out:build\msys2-tests.exe `
            /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll `
            src\Msys2Flavour.cs src\ShimBuilder.cs src\PresetWriter.cs src\InstallerForm.cs `
            tests\TestFramework.cs tests\InstallerTests.cs tests\ShimTests.cs tests\TestMain.cs
          if ($LASTEXITCODE -ne 0) { Write-Error "debug build failed"; exit 1 }

          if (-not (Test-Path build\msys2-tests.pdb)) {
            Write-Error "no PDB was produced; coverage would have no sequence points to report"
            exit 1
          }
          Write-Host "debug symbols: build\msys2-tests.pdb"

      - name: Install coverage tooling
        id: coverage_tools
        # A missing coverage tool must not fail the lenient workflow — it is
        # reported as "unavailable" instead, so a network hiccup cannot break
        # the default branch. release.yml, which demands coverage, treats the
        # same condition as fatal.
        continue-on-error: true
        run: |
          $dest = "$env:COVERAGE_TOOLS\opencover"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $nupkg = "$env:COVERAGE_TOOLS\opencover.zip"

          # nuget.org's flat-container endpoint for the immutable version.
          $url = 'https://www.nuget.org/api/v2/package/OpenCover/4.7.1221'
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $nupkg -UseBasicParsing
          Expand-Archive -Path $nupkg -DestinationPath $dest -Force

          $console = Get-ChildItem -Path $dest -Recurse -Filter 'OpenCover.Console.exe' |
            Select-Object -First 1
          if (-not $console) { throw "OpenCover.Console.exe not found in the package" }
          Write-Host "coverage tool: $($console.FullName)"
          "console=$($console.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run test suite under coverage
        id: tests
        # The suite's exit code is the gate (0 = all passed or skipped, 1 = a
        # failure). A failure is fatal even here: "tests may be skipped" is not
        # "tests may fail". Skipped tests do not fail this step; they are
        # surfaced by the coverage report below.
        run: |
          $console = '${{ steps.coverage_tools.outputs.console }}'
          if ($console -and (Test-Path $console)) {
            & $console -register:user `
              -target:build\msys2-tests.exe `
              -targetdir:build `
              -filter:"+[Dsh*]* -[Dsh*]Tests.*" `
              -output:coverage.xml `
              -coverbytest:"Dsh.Msys2Installer.Tests.*" 2>&1 |
              Tee-Object -FilePath test-output.txt
            $code = $LASTEXITCODE

            # OpenCover propagates the target's exit code, but a coverage
            # failure can mask it, so re-run the suite directly if OpenCover
            # itself errored. A genuine test failure must never be swallowed
            # by the coverage wrapper.
            if ($code -ne 0) {
              Write-Host ""
              Write-Host "OpenCover exited $code; re-running the suite directly to separate"
              Write-Host "a real test failure from a coverage-tool failure."
              & .\build\msys2-tests.exe 2>&1 | Tee-Object -FilePath test-output.txt
              $code = $LASTEXITCODE
            }
          } else {
            Write-Host "::warning::Coverage tooling unavailable; running the suite without coverage."
            & .\build\msys2-tests.exe 2>&1 | Tee-Object -FilePath test-output.txt
            $code = $LASTEXITCODE
          }

          # Publish the counts so later steps and release.yml can assert on them.
          $m = Select-String -Path test-output.txt -Pattern '^(passed|failed|skipped):\s+(\d+)'
          foreach ($line in $m) {
            $parts = $line.Line -split ':\s+'
            "$($parts[0])=$($parts[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          exit $code

      - name: Report coverage
        if: always()
        # This is the step that makes the lenient policy honest. Because skips
        # are allowed here, the counts MUST be visible: the job summary states
        # exactly how many tests ran and names the ones that did not.
        run: |
          $summary = @()
          $summary += "## Test and coverage report"
          $summary += ""

          $counts = Select-String -Path test-output.txt -Pattern '^(passed|failed|skipped|total):\s+(\d+)' -ErrorAction SilentlyContinue
          if ($counts) {
            $summary += "| Result | Count |"
            $summary += "| --- | --- |"
            foreach ($line in $counts) {
              $p = $line.Line -split ':\s+'
              $summary += "| $($p[0]) | $($p[1]) |"
            }
            $summary += ""
          }

          # Name every skipped test and its reason. A skip that is not named is
          # a silent gap in coverage, which is the specific failure mode this
          # workflow is designed to prevent.
          #
          # TestMain.cs writes "  <name> — <reason>" using an em dash (U+2014).
          # The dash is spelled as an escape so this pattern cannot be broken
          # by an encoding change in this file, whichever way it is re-saved.
          $skipPattern = "^\s{2}(\S+)\s+" + [char]0x2014 + "\s+(.+)$"
          $skips = Select-String -Path test-output.txt -Pattern $skipPattern -ErrorAction SilentlyContinue
          if ($skips) {
            $summary += "### Skipped checks ($($skips.Count))"
            $summary += ""
            $summary += "These did **not** run, so their claims are unverified:"
            $summary += ""
            foreach ($s in $skips) { $summary += "- ``$($s.Matches[0].Groups[1].Value)`` — $($s.Matches[0].Groups[2].Value)" }
            $summary += ""
          } else {
            $summary += "No tests were skipped."
            $summary += ""
          }

          # Line/branch figures from the OpenCover XML.
          if (Test-Path coverage.xml) {
            try {
              [xml]$cov = Get-Content coverage.xml -Raw
              $overall = $cov.CoverageSession.Summary
              $summary += "### Code coverage (line / branch)"
              $summary += ""
              $summary += "| Metric | Covered | Total | Percent |"
              $summary += "| --- | --- | --- | --- |"
              $summary += "| Lines | $($overall.visitedSequencePoints) | $($overall.numSequencePoints) | $($overall.sequenceCoverage)% |"
              $summary += "| Branches | $($overall.visitedBranchPoints) | $($overall.numBranchPoints) | $($overall.branchCoverage)% |"
              $summary += "| Methods | $($overall.visitedMethods) | $($overall.numMethods) | $($overall.methodCoverage)% |"
              $summary += ""
              $summary += "_Line and branch coverage come from PDB sequence points, which is why the"
              $summary += "test assembly is rebuilt with ``/debug:full``. The 10 MSYS2 tests are"
              $summary += "excluded from the filter when they skip, so a skipped run shows lower"
              $summary += "coverage rather than hiding the gap._"
            } catch {
              $summary += "Coverage XML was produced but could not be parsed: $($_.Exception.Message)"
            }
          } else {
            $summary += "### Code coverage"
            $summary += ""
            $summary += "**No coverage was produced in this run.** The test results above are"
            $summary += "reported without line/branch numbers, so treat them as unmeasured."
          }

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary | ForEach-Object { Write-Host $_ }

      - name: Install the DSH harness
        # Nothing in this workflow previously installed DSH, so there was no
        # harness to smoke-test and tests/validate-preset.cjs had to fake its
        # dependency: it loads js-yaml from
        # %USERPROFILE%\.dsh\profiles\node_modules\js-yaml — a path only a real
        # DSH install creates — and a later step used to `npm install js-yaml`
        # into that directory by hand to satisfy it.
        #
        # That hand-rolled install was the wrong shape in two ways. It validated
        # presets against a library version DSH might not use, and it proved
        # nothing about the harness actually being installable and bootable,
        # which is the claim this project rests on: the presets are only
        # meaningful if DSH can load them.
        #
        # `npx @deepseek-ai/dsh` is the documented entry point (README: "after
        # installing you just run npx @deepseek-ai/dsh web"). Its --version and
        # --help are side-effect free; a bare `dsh web` would bind a port and
        # block, which is why the smoke check below does not do that.
        #
        # js-yaml is a DIRECT dependency of the published package (^4.2.0), so
        # installing DSH puts the real library exactly where validate-preset.cjs
        # looks, with no separate install step and no version guessing.
        run: |
          $ErrorActionPreference = 'Stop'

          # Pin nothing: "latest" is the point, because the presets must load on
          # whatever a user gets from `npx` today. --version prints the resolved
          # version, so the log records which harness release this run was
          # validated against and a future failure can be attributed to it.
          npx --yes @deepseek-ai/dsh@latest --version
          if ($LASTEXITCODE -ne 0) { Write-Error "dsh --version exited $LASTEXITCODE"; exit 1 }

      - name: Verify the DSH install landed where the preset tooling looks
        # The install is only useful if it produces the exact layout
        # validate-preset.cjs and DSH's own preset discovery read. Assert that
        # layout here, so a change in the harness's install shape fails with a
        # precise message instead of surfacing later as a confusing js-yaml
        # "module not found" or, worse, as a silently unvalidated preset.
        run: |
          $profiles = Join-Path $env:USERPROFILE '.dsh\profiles'
          $yaml = Join-Path $profiles 'node_modules\js-yaml'
          $dsh = Join-Path $profiles 'node_modules\@deepseek-ai\dsh'

          foreach ($p in @($yaml, $dsh)) {
            if (-not (Test-Path $p)) {
              Write-Host "expected the DSH install to provide:"
              Write-Host "  $yaml"
              Write-Host "  $dsh"
              Write-Host "found under ${profiles}:"
              if (Test-Path $profiles) {
                Get-ChildItem $profiles -Force | ForEach-Object { Write-Host "  $($_.Name)" }
              } else {
                Write-Host "  (the directory does not exist at all)"
              }
              Write-Error "the DSH install did not produce $p"
              exit 1
            }
          }

          # Report the versions actually in play. These two numbers are the
          # provenance of every preset validation result in this run.
          $dshPkg = Get-Content (Join-Path $dsh 'package.json') -Raw | ConvertFrom-Json
          $yamlPkg = Get-Content (Join-Path $yaml 'package.json') -Raw | ConvertFrom-Json
          Write-Host "dsh:     $($dshPkg.version)"
          Write-Host "js-yaml: $($yamlPkg.version)  (a real dependency of dsh, not a stand-in)"

      - name: Smoke-test the DSH CLI against the installed presets
        # The point of this step is the claim nothing else in this workflow
        # tests: that the harness is present, runnable, and aware of the preset
        # surface this installer writes into. `dsh --help` exercises the real
        # argument parser and plugin boot, which a preset validation alone does
        # not.
        #
        # Deliberately NOT `dsh web`: that starts a server and blocks, so it
        # would need a port, a readiness probe and a teardown to prove only
        # slightly more than --help already does here.
        run: |
          $help = npx --yes @deepseek-ai/dsh@latest --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "dsh --help exited $LASTEXITCODE"; exit 1 }

          Write-Host $help

          # `web` is the documented command in the README's quick start, so it
          # must be a recognised verb. If the harness ever renames it, the
          # README's instructions break and this catches that.
          if ($help -notmatch 'web') {
            Write-Error "the dsh CLI does not document a 'web' command; the README's quick start would be wrong"
            exit 1
          }
          Write-Host "ok   dsh CLI is installed and documents the 'web' command"

      - name: Verify headless CLI
        # The README documents this surface, and a WinForms build can compile
        # yet still fail before Main's argument parsing. --list is side-effect
        # free (--install is not: it writes presets).
        #
        # This checks msys2-installer-cli.exe, NOT msys2-installer.exe. The
        # latter is /target:winexe (PE subsystem 2); such a process has no
        # console and its exit code CANNOT be observed by the caller, which is
        # precisely how this step used to fail: $LASTEXITCODE came back empty,
        # `$LASTEXITCODE -ne 0` evaluated as `$null -ne 0` — true — and the step
        # died with "--list exited " and no number. The CLI is a console
        # subsystem binary, so stdout and the exit code both work normally.
        run: |
          $listing = & .\build\msys2-installer-cli.exe --list
          if ($LASTEXITCODE -ne 0) { Write-Error "--list exited $LASTEXITCODE"; exit 1 }
          $listing | Write-Host

          # Parse the listing into (key -> line) instead of pattern-matching the
          # whole array. `$listing -notmatch <re>` is NOT a boolean test: on a
          # collection, -notmatch FILTERS, returning the elements that did not
          # match. 'mingw64' matches only line 1, so the expression returned the
          # other 4 lines — a non-empty array, which `if` coerces to $true — and
          # the step failed with "flavour 'mingw64' is missing from --list" while
          # printing mingw64 on the line directly above. An empty array is the
          # only falsy collection, so a missing flavour and a present one were
          # indistinguishable. Compare exact keys, which cannot drift.
          $keys = @{}
          foreach ($line in $listing) {
            $cols = $line -split "`t"
            if ($cols.Count -ge 1 -and $cols[0]) { $keys[$cols[0]] = $line }
          }

          # Assert the exact key set, so a sixth flavour or a dropped one fails
          # here rather than passing on a substring hit.
          $expected = 'mingw64','mingw32','ucrt64','clang64','clangarm64'
          $missing = @($expected | Where-Object { -not $keys.ContainsKey($_) })
          $extra   = @($keys.Keys | Where-Object { $expected -notcontains $_ })

          if ($missing.Count -gt 0) {
            Write-Error "flavours missing from --list: $($missing -join ', ')"
            exit 1
          }
          if ($extra.Count -gt 0) {
            Write-Error "unexpected flavours in --list: $($extra -join ', ')"
            exit 1
          }
          if ($keys.Count -ne 5) {
            Write-Error "--list printed $($keys.Count) flavours, expected 5"
            exit 1
          }

          $expected | ForEach-Object { Write-Host "ok   $_" }
          Write-Host "all five flavours are listed"

      - name: End-to-end install and preset validation
        env:
          DSH_HOME: ${{ github.workspace }}\.ci-dsh-home
        run: |
          & .\build\msys2-installer-cli.exe --install
          if ($LASTEXITCODE -ne 0) { Write-Error "--install exited $LASTEXITCODE"; exit 1 }

          $presets = Join-Path $env:DSH_HOME '.agent-presets'
          $dirs = Get-ChildItem $presets -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'msys2-*' }
          if ($dirs.Count -eq 0) {
            Write-Error "no msys2-* presets were written under $presets"
            exit 1
          }
          Write-Host "wrote $($dirs.Count) preset(s):"
          $dirs | ForEach-Object { Write-Host "  $($_.Name)" }

          foreach ($d in $dirs) {
            $shim = Join-Path $d.FullName 'msys2_shell_shim.exe'
            if (-not (Test-Path $shim)) { Write-Error "no shim in $($d.Name)"; exit 1 }
            if ((Get-Item $shim).Length -eq 0) { Write-Error "empty shim in $($d.Name)"; exit 1 }
          }

          # validate-preset.cjs deliberately validates with the same YAML
          # library DSH uses, loaded from the installed harness at
          # $USERPROFILE\.dsh\profiles\node_modules\js-yaml. That library is now
          # supplied by the "Install the DSH harness" step above, as a real
          # dependency of the real package rather than a hand-installed stand-in.
          # Assert it is present here so this step fails with a clear message
          # rather than the script's generic "could not load js-yaml" (exit 2).
          $yaml = Join-Path $env:USERPROFILE '.dsh\profiles\node_modules\js-yaml'
          if (-not (Test-Path $yaml)) {
            Write-Error "js-yaml is missing at $yaml; the DSH install step did not provide it"
            exit 1
          }
          Write-Host "validating with the harness's own YAML library: $yaml"

          node tests/validate-preset.cjs $presets
          if ($LASTEXITCODE -ne 0) {
            Write-Error "preset validation failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Upload coverage and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-coverage-and-build
          path: |
            coverage.xml
            test-output.txt
            build/msys2-installer.exe
            build/msys2-installer-cli.exe
            build/msys2-tests.exe
            build/msys2-tests.pdb
            build/Msys2ShellShim.cs
          if-no-files-found: warn
